name = "nerb-telegram-bot"
main = "worker.js"
compatibility_date = "2024-11-01"

# Секреты (BOT_TOKEN, CHAT_ID, при желании WEBHOOK_SECRET) НЕ храните здесь.
# Задавайте их командой:
#   wrangler secret put BOT_TOKEN
#   wrangler secret put CHAT_ID
#   wrangler secret put WEBHOOK_SECRET   (опционально)
[[durable_objects.bindings]]
name = "MEDIA_GROUP_TRACKER"
class_name = "MediaGroupTracker"

[[migrations]]
tag = "v1"
new_classes = ["MediaGroupTracker"]
[vars]
BOT_USERNAME = "NERBbI_bot"